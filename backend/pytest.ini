[pytest]
minversion = 7.0
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Pruebas unitarias de dominio, modelos y logica cuantitativa
    integration: Pruebas de integracion con base de datos SQLite, endpoints y contratos API
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

