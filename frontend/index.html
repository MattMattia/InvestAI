<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%230284c7'/><stop offset='55%25' stop-color='%2310b981'/><stop offset='100%25' stop-color='%236366f1'/></linearGradient></defs><polygon points='17,5 31,5 43,17 43,31 31,43 17,43 5,31 5,17' fill='url(%23g)'/><rect x='13' y='28' width='4.5' height='7' rx='1' fill='white' opacity='.85'/><rect x='20' y='24' width='4.5' height='11' rx='1' fill='white' opacity='.9'/><rect x='27' y='20' width='4.5' height='15' rx='1' fill='white' opacity='.95'/><path d='M11 29 C 14 17, 24 12.5, 35 13' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/><circle cx='35' cy='13' r='2.6' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InvestAI — Plataforma Institucional de Gestión Cuantitativa de Carteras y Evaluación Determinista de Riesgo Financiero" />
    <meta name="theme-color" content="#0b0f19" />
    <title>InvestAI — Gestión y Riesgo de Portafolios</title>
    <style>
      /* Instant boot splash: painted before any script loads, replaced when React mounts. */
      html,
      body {
        background: #020617;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #020617;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      .boot-splash__logo {
        width: 88px;
        height: 88px;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-splash__title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.22em;
      }
      .boot-splash__subtitle {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #94a3b8;
        text-align: center;
        padding: 0 16px;
      }
      .boot-splash__bar {
        position: relative;
        width: 220px;
        height: 3px;
        border-radius: 999px;
        background: #1e293b;
        overflow: hidden;
      }
      .boot-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0ea5e9, #10b981);
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.35));
        }
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.55));
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__logo,
        .boot-splash__bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <svg class="boot-splash__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="boot-shield" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="55%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#6366f1" />
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="23" fill="none" stroke="url(#boot-shield)" stroke-width="1" opacity="0.4" />
          <polygon points="17,5 31,5 43,17 43,31 31,43 17,43 5,31 5,17" fill="url(#boot-shield)" />
          <rect x="13" y="28" width="4.5" height="7" rx="1" fill="#ffffff" opacity="0.85" />
          <rect x="20" y="24" width="4.5" height="11" rx="1" fill="#ffffff" opacity="0.9" />
          <rect x="27" y="20" width="4.5" height="15" rx="1" fill="#ffffff" opacity="0.95" />
          <path d="M11 29 C 14 17, 24 12.5, 35 13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <circle cx="35" cy="13" r="2.6" fill="#ffffff" />
        </svg>
        <p class="boot-splash__title">INVESTAI ENTERPRISE</p>
        <p class="boot-splash__subtitle">MOTOR CUANTITATIVO DE PORTAFOLIOS Y RIESGO DETERMINISTA — BYMA</p>
        <div class="boot-splash__bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
