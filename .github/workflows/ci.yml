name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-ci:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
          python-version: "3.11"
      # uv-managed interpreters are marked externally managed, so install into a venv
      # and put it first on PATH for the following steps.
      - name: Install dependencies
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv -r backend/requirements.txt
      # Ruff version pinned to match .pre-commit-config.yaml; ruff.toml excludes Alembic migrations.
      - name: Ruff lint
        run: uvx ruff@0.9.6 check backend
      - name: Ruff format
        run: uvx ruff@0.9.6 format --check backend
      - name: Pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  frontend-ci:
    name: Frontend (biome + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # Biome is pinned in the root package.json next to biome.json.
      - name: Install root tooling
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Biome
        run: npx @biomejs/biome ci frontend/src frontend/e2e
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    name: E2E (Playwright)
    needs: [frontend-ci]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
