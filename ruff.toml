line-length = 100
target-version = "py311"
extend-exclude = [
  "backend/alembic/versions",
  ".venv",
  "venv",
  ".codegraph",
  "node_modules",
]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "S101"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[lint.per-file-ignores]
# Test fixtures use throwaway credentials and non-cryptographic randomness.
"backend/tests/**" = ["S105", "S106", "S311"]
# Demo seed script uses a fixed demo password.
"backend/scripts/seed*.py" = ["S105", "S106"]
